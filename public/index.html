<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Game Master 🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* [Mantendo seu estilo original e adicionando o novo] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff0f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 95%; max-width: 600px; height: 90vh; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 4px solid #ffb6d9; position: relative; }
        .header { background: #ff69b4; padding: 20px; text-align: center; color: white; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; background: #fffafa; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; margin-bottom: 10px; }
        .message.user { justify-content: flex-end; }
        .message-content { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
        .user .message-content { background: #ff69b4; color: white; }
        .bot .message-content { background: white; border: 2px solid #ffc0e0; color: #d1486a; }
        .input-section { padding: 15px; background: white; display: flex; gap: 10px; align-items: center; border-top: 2px solid #ffebf0; }
        .input-wrapper { flex: 1; background: #fdf2f7; border-radius: 20px; padding: 8px 15px; border: 2px solid #ffc0e0; }
        input { width: 100%; border: none; outline: none; background: transparent; }
        .btn { background: #ff69b4; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        #previewContainer { display: none; padding: 10px; background: white; text-align: center; border-top: 2px solid #ffc0e0; }
        #previewImg { max-height: 80px; border-radius: 10px; }
        .hidden { display: none !important; }
        #authOverlay { position: fixed; inset: 0; background: #ff69b4; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 300px; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card" id="loginForm">
            <h2 style="color: #ff69b4">🎀 Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" style="border: 1px solid #ffc0e0; margin: 10px 0; padding: 10px; border-radius: 10px;">
            <input type="password" id="loginSenha" placeholder="Senha" style="border: 1px solid #ffc0e0; margin: 10px 0; padding: 10px; border-radius: 10px;">
            <button onclick="executarLogin()" style="background: #ff69b4; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; width: 100%;">Entrar</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h3 id="txtBoasVindas">Hello Kitty Game Master 🎀</h3>
            <button onclick="verRanking()" style="position: absolute; left: 10px; top: 10px; background: gold; border: none; border-radius: 5px; padding: 5px;">🏆 Rank</button>
            <button onclick="logout()" style="position: absolute; right: 10px; top: 10px; background: #ff4d6d; border: none; border-radius: 5px; padding: 5px; color: white;">Sair</button>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div id="previewContainer">
            <img id="previewImg" src="">
            <button onclick="cancelarImg()" style="background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">X</button>
        </div>

        <div class="input-section">
            <button class="btn" onclick="document.getElementById('fileInput').click()" style="background: #ff85c1;">📎</button>
            <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="mostrarPreview(this)">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Mensagem...">
            </div>
            <button class="btn" onclick="sendMessage()">↑</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let userNickname = "";

        function mostrarPreview(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function cancelarImg() {
            document.getElementById('fileInput').value = "";
            document.getElementById('previewContainer').style.display = 'none';
        }

        async function sendMessage() {
            const text = document.getElementById('messageInput').value;
            const file = document.getElementById('fileInput').files[0];
            const token = localStorage.getItem('token_saas');

            if (!text && !file) return;

            // UI local
            addMessage(text || "Enviou uma imagem", true, file ? document.getElementById('previewImg').src : null);
            document.getElementById('messageInput').value = "";
            cancelarImg();

            try {
                let res;
                if (file) {
                    const fd = new FormData();
                    fd.append('image', file);
                    fd.append('prompt', text);
                    fd.append('nickname', userNickname);
                    res = await fetch(`${API_URL}/api/chat/vision`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: fd
                    });
                } else {
                    res = await fetch(`${API_URL}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ message: text, nickname: userNickname })
                    });
                }
                const data = await res.json();
                addMessage(data.resposta, false, data.imageUrl);
            } catch (e) { addMessage("Erro 🎀", false); }
        }
async function verRanking() {
    const modal = document.getElementById('rankingModal');
    const list = document.getElementById('rankingList');
    const token = localStorage.getItem('token_saas');

    // Mostra o modal e limpa a lista com um "Carregando"
    modal.style.display = 'flex';
    list.innerHTML = "<p style='text-align:center'>Carregando... 🎀</p>";

    try {
        const res = await fetch(`${API_URL}/api/chat/ranking`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const jogadores = await res.json();

        if (res.ok) {
            // Cria a lista fofinha de jogadores
            list.innerHTML = jogadores.map((p, i) => `
                <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ffe4f0; font-size: 14px;">
                    <span>${i + 1}º <b>${p.nickname}</b></span>
                    <span style="color: #ff69b4;">${p.xp} XP</span>
                </div>
            `).join('');
            
            if(jogadores.length === 0) list.innerHTML = "<p>Ninguém pontuou ainda! 🌸</p>";
        } else {
            list.innerHTML = "<p>Erro ao carregar o ranking. 😢</p>";
        }
    } catch (e) {
        list.innerHTML = "<p>Erro de conexão. 🎀</p>";
    }
}
        function addMessage(text, isUser, img = null) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            let html = `<div class="message-content">`;
            if (img) html += `<img src="${img}" style="max-width:100%; border-radius:10px; margin-bottom:5px;"><br>`;
            html += `<span>${isUser ? text : marked.parse(text)}</span></div>`;
            div.innerHTML = html;
            document.getElementById('chatContainer').appendChild(div);
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        async function executarLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const res = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token_saas', data.token);
                localStorage.setItem('user_nome', data.nome);
                userNickname = data.nome;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('txtBoasVindas').innerText = `Oi, ${userNickname}! 🎀`;
            } else alert(data.erro);
        }

        function logout() { localStorage.clear(); location.reload(); }
        window.onload = () => {
            const t = localStorage.getItem('token_saas');
            if(t) {
                userNickname = localStorage.getItem('user_nome');
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('txtBoasVindas').innerText = `Oi, ${userNickname}! 🎀`;
            }
        }
    </script>
    <!-- Modal do Hall da Fama (Pop-up do Ranking) -->
<div id="rankingModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;" onclick="this.style.display='none'">
    <div class="auth-card" style="width: 350px; position: relative;" onclick="event.stopPropagation()">
        <h2 style="color: #ff69b4; margin-bottom: 15px;">🥇 Hall da Fama</h2>
        <div id="rankingList" style="text-align: left; margin-bottom: 20px; max-height: 300px; overflow-y: auto;">
            <!-- Os jogadores aparecerão aqui -->
        </div>
        <button onclick="document.getElementById('rankingModal').style.display='none'" style="background: #ff69b4; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer;">Fechar</button>
    </div>
</div>
</body>
</html>
