<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Hello Kitty</title>
    <!-- PASSO 1: Adicionar a biblioteca Marked.js para ler negrito/listas/códigos -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ... Seus estilos anteriores se mantêm ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff0f7 0%, #ffe4f0 50%, #ffd9eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: linear-gradient(to bottom, #ffebf0 0%, #fff5f9 100%);
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(255, 105, 180, 0.2), 0 0 0 1px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            overflow: hidden;
            border: 3px solid #ffb6d9;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c1 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #ff1493;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }

        .header-title {
            color: white;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            margin-top: 5px;
            font-weight: 300;
        }

        /* ESTILO DO BOTÃO LIMPAR */
        .btn-limpar {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            position: absolute;
            top: 20px;
            right: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-limpar:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            gap: 15px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.6), rgba(255, 240, 247, 0.8));
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        /* Ajuste para o Markdown não bugar o visual */
        .message-content p {
            margin-bottom: 8px;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c1 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: white;
            color: #d1486a;
            border: 2px solid #ffc0e0;
            border-bottom-left-radius: 5px;
        }

        .input-section {
            padding: 20px;
            border-top: 2px solid #ffb6d9;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: white;
            border-radius: 25px;
            border: 2px solid #ffc0e0;
            padding: 10px 20px;
        }

        #messageInput {
            width: 100%;
            border: none;
            outline: none;
        }

        .send-btn {
            background: #ff69b4;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        <!-- Adicione este CSS dentro da tag <style> -->

    /* Overlay de Autenticação */
    #authOverlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #ff69b4 0%, #ffc0e0 100%);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .auth-card {
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        width: 90%;
        max-width: 400px;
        text-align: center;
    }

    .auth-card h2 { color: #ff1493; margin-bottom: 20px; }
    .auth-card input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 2px solid #ffc0e0;
        border-radius: 15px;
        outline: none;
    }

    .auth-card button {
        width: 100%;
        padding: 12px;
        background: #ff69b4;
        color: white;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
    }

    .toggle-auth {
        margin-top: 15px;
        font-size: 13px;
        color: #ff1493;
        cursor: pointer;
        text-decoration: underline;
    }

    .hidden { display: none !important; }

    .btn-logout { 
    right: 80px; /* Posiciona ao lado do botão Reset */
    background: #ff85a1; 
    color: white; 
}
</style>


</head>

<body>

    <!-- Adicione este HTML logo no início do <body> -->
<div id="authOverlay">
    <div class="auth-card" id="loginForm">
        <h2>🎀 Bem-vinda(o)!</h2>
        <input type="email" id="loginEmail" placeholder="Seu e-mail">
        <input type="password" id="loginSenha" placeholder="Sua senha">
        <button onclick="executarLogin()">Entrar</button>
        <p class="toggle-auth" onclick="alternarAuth(true)">Não tem conta? Cadastre-se</p>
    </div>

    <div class="auth-card hidden" id="registerForm">
        <h2>✨ Criar Conta</h2>
        <input type="text" id="regNome" placeholder="Nome/Nickname">
        <input type="email" id="regEmail" placeholder="E-mail">
        <input type="password" id="regSenha" placeholder="Senha">
        <button onclick="executarCadastro()">Cadastrar</button>
        <p class="toggle-auth" onclick="alternarAuth(false)">Já tem conta? Faça Login</p>
    </div>
</div> 
<div>
    <button class="btn-top btn-logout" onclick="logout()">🚪 Sair</button>
</div>
    <div class="container">
        <!-- BOTÃO DE LIMPAR -->
        <button class="btn-limpar" onclick="limparConversa()">🗑️ Limpar</button>

        <div class="header">
            <div class="bow-decoration">🎀</div>
            <div class="header-title">IA Hello Kitty</div>
            <div class="header-subtitle">Sua assistente delicada 💕</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🎀</div>
                <div class="empty-state-text">Olá! Vamos conversar? 💕</div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Digite aqui..." autocomplete="off">
            </div>
            <button class="send-btn" id="sendBtn">↑</button>
        </div>
    </div>

    <script>
   // --- FUNÇÃO DE SAIR (LOGOUT) ---
function logout() {
    // Remove as credenciais do navegador
    localStorage.removeItem('token_saas');
    localStorage.removeItem('user_nome');
    
    // Recarrega a página para voltar ao estado inicial (Tela de Login)
    location.reload();
}

// --- PERSISTÊNCIA DE LOGIN (AUTO-LOGIN) ---
// Esta função roda assim que a página termina de carregar
window.onload = () => {
    const tokenValido = localStorage.getItem('token_saas');
    const nomeSalvo = localStorage.getItem('user_nome');

    if (tokenValido && nomeSalvo) {
        // Se temos o token, pulamos a tela de login
        userNickname = nomeSalvo;
        
        // Esconde o overlay de autenticação imediatamente
        document.getElementById('authOverlay').classList.add('hidden');
        
        // Libera o input do chat
        messageInput.disabled = false;
        sendBtn.disabled = false;

        // Mensagem de boas-vindas personalizada
        addMessage(`Que bom que você voltou, **${userNickname}**! 💖 Pronta(o) para mais desafios?`, false);
    }
};

// --- PEQUENO AJUSTE NA FUNÇÃO DE LOGIN ---
// (Garanta que a função executarLogin salve os dados corretamente)
async function executarLogin() {
    const email = document.getElementById('loginEmail').value;
    const senha = document.getElementById('loginSenha').value;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (response.ok) {
            // Salva o crachá e o nome
            localStorage.setItem('token_saas', data.token);
            localStorage.setItem('user_nome', data.nome);
            userNickname = data.nome;

            // Esconde a tela de login e libera o chat
            document.getElementById('authOverlay').classList.add('hidden');
            messageInput.disabled = false;
            sendBtn.disabled = false;

            addMessage(`Olá ${userNickname}! Sou sua Game Master. Vamos começar? 🎀`, false);
        } else {
            alert(data.erro || "Falha no login");
        }
    } catch (error) {
        alert("Erro ao conectar com o servidor.");
    }

};


</script>
</body>

</html>
