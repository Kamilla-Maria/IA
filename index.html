<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Hello Kitty - Protegido 🎀</title>

    <!-- Bibliotecas: Markdown para a IA -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff0f7 0%, #ffe4f0 50%, #ffd9eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TELA DE LOGIN E CADASTRO (OVERLAY) --- */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff69b4 0%, #ffc0e0 100%);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            color: #ff1493;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            border: 2px solid #ffc0e0;
            border-radius: 20px;
            outline: none;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-auth:hover {
            background: #ff1493;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .toggle-link span {
            color: #ff1493;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        /* --- CONTAINER PRINCIPAL DO CHAT --- */
        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.2);
            width: 95%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #ffb6d9;
            position: relative;
        }

        /* Botões do Topo */
        .header-btns {
            position: absolute;
            top: 15px;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .btn-top {
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-rank {
            background: #ffcc00;
            color: #555;
        }

        .btn-out {
            background: #ff4d6d;
        }

        .btn-clr {
            background: #ff85c1;
        }

        .header {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c1 100%);
            padding: 35px 20px 20px;
            text-align: center;
            color: white;
        }

        /* CHAT */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fffafa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user .message-content {
            background: #ff69b4;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            border: 2px solid #ffc0e0;
            color: #d1486a;
            border-bottom-left-radius: 2px;
        }

        .input-section {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: white;
            border-top: 2px solid #ffebf0;
        }

        .input-wrapper {
            flex: 1;
            background: #fdf2f7;
            border-radius: 25px;
            padding: 10px 20px;
            border: 2px solid #ffc0e0;
        }

        #messageInput {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
        }

        .send-btn {
            background: #ff69b4;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        /* MODAL DE RANKING */
        #rankingModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .ranking-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 300px;
            border: 4px solid #ff69b4;
        }
    </style>
</head>

<body>

    <!-- 1. TELA DE AUTENTICAÇÃO -->
    <div id="authOverlay">
        <!-- Card de Login -->
        <div class="auth-card" id="loginForm">
            <h2>🎀 Login</h2>
            <input type="email" id="loginEmail" placeholder="Seu e-mail">
            <input type="password" id="loginSenha" placeholder="Sua senha">
            <button class="btn-auth" onclick="executarLogin()">Entrar</button>
            <p class="toggle-link">Não tem conta? <span onclick="alternarAuth(true)">Cadastre-se</span></p>
        </div>

        <!-- Card de Cadastro (Escondido por padrão) -->
        <div class="auth-card hidden" id="registerForm">
            <h2>✨ Cadastro</h2>
            <input type="text" id="regNome" placeholder="Seu Nome">
            <input type="email" id="regEmail" placeholder="Seu e-mail">
            <input type="password" id="regSenha" placeholder="Crie uma senha">
            <button class="btn-auth" onclick="executarCadastro()">Cadastrar</button>
            <p class="toggle-link">Já tem conta? <span onclick="alternarAuth(false)">Fazer Login</span></p>
        </div>
    </div>

    <!-- 2. APLICAÇÃO PRINCIPAL -->
    <div class="container">
        <div class="header-btns">
            <button class="btn-top btn-rank" onclick="verRanking()">🏆 Rank</button>
            <button class="btn-top btn-clr" onclick="limparConversa()">🗑️ Reset</button>
            <button class="btn-top btn-out" onclick="logout()">🚪 Sair</button>
        </div>

        <div class="header">
            <h3>Hello Kitty SaaS 🎀</h3>
            <p id="txtBoasVindas">Faça login para conversar!</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <!-- Mensagens aparecem aqui -->
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." disabled>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
        </div>
    </div>

    <!-- 3. MODAL DE RANKING -->
    <div id="rankingModal" onclick="this.style.display='none'">
        <div class="ranking-card" onclick="event.stopPropagation()">
            <h2 style="text-align: center; color: #ff69b4;">🥇 Hall da Fama</h2>
            <div id="rankingList" style="margin: 20px 0;"></div>
            <button class="btn-auth"
                onclick="document.getElementById('rankingModal').style.display='none'">Fechar</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÕES ---
        // Se testar localmente, mude para: 'http://localhost:3000'
        // Se estiver na Vercel/Render, deixe vazio: ''
        const API_URL = '';

        let userNickname = "";
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // --- GESTÃO DE TELAS ---
        function alternarAuth(mostrarCadastro) {
            document.getElementById('loginForm').classList.toggle('hidden', mostrarCadastro);
            document.getElementById('registerForm').classList.toggle('hidden', !mostrarCadastro);
        }

        // --- PERSISTÊNCIA (AUTO-LOGIN) ---
        window.onload = () => {
            const token = localStorage.getItem('token_saas');
            const nome = localStorage.getItem('user_nome');

            if (token && nome) {
                userNickname = nome;
                entrarNoApp();
                addMessage(`Bom te ver de novo, **${userNickname}**! ✨`, false);
            }
        };

        function entrarNoApp() {
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('txtBoasVindas').innerText = `Bem-vinda(o), ${userNickname}! 💕`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
        }

        // --- FUNÇÕES DE API ---

        async function executarCadastro() {
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;

            try {
                const res = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });
                const data = await res.json();
                if (res.ok) { alert("Cadastro ok! Agora faça login."); alternarAuth(false); }
                else { alert(data.erro); }
            } catch (e) { alert("Erro de conexão."); }
        }

        async function executarLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token_saas', data.token);
                    localStorage.setItem('user_nome', data.nome);
                    userNickname = data.nome;
                    entrarNoApp();
                } else { alert(data.erro); }
            } catch (e) { alert("Erro ao logar."); }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            const token = localStorage.getItem('token_saas');
            if (!message || !token) return;

            addMessage(message, true);
            messageInput.value = '';

            try {
                const res = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message, nickname: userNickname })
                });
                const data = await res.json();
                if (res.status === 401) logout();
                else addMessage(data.resposta, false);
            } catch (e) { addMessage("Erro ao falar com o servidor.", false); }
        }

        async function verRanking() {
            const token = localStorage.getItem('token_saas');
            document.getElementById('rankingModal').style.display = 'flex';
            const list = document.getElementById('rankingList');
            list.innerHTML = "Carregando...";

            try {
                const res = await fetch(`${API_URL}/api/chat/ranking`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                list.innerHTML = data.map((p, i) => `<div>${i + 1}º ${p.nickname} - ${p.xp} XP</div>`).join('');
            } catch (e) { list.innerHTML = "Erro ao carregar."; }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function limparConversa() {
            const token = localStorage.getItem('token_saas');
            if (confirm("Resetar chat?")) {
                await fetch(`${API_URL}/api/chat/limpar`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                chatContainer.innerHTML = "";
            }
        }

        // Auxiliar: Mostrar mensagens
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = isUser ? text : marked.parse(text);
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Enter para enviar
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>

</html>
