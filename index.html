<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Hello Kitty</title>
    <!-- PASSO 1: Adicionar a biblioteca Marked.js para ler negrito/listas/códigos -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ... Seus estilos anteriores se mantêm ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff0f7 0%, #ffe4f0 50%, #ffd9eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: linear-gradient(to bottom, #ffebf0 0%, #fff5f9 100%);
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(255, 105, 180, 0.2), 0 0 0 1px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            overflow: hidden;
            border: 3px solid #ffb6d9;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c1 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #ff1493;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }

        .header-title {
            color: white;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            margin-top: 5px;
            font-weight: 300;
        }

        /* ESTILO DO BOTÃO LIMPAR */
        .btn-limpar {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            position: absolute;
            top: 20px;
            right: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-limpar:hover {
            background: #ff1493;
            transform: scale(1.05);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            gap: 15px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.6), rgba(255, 240, 247, 0.8));
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        /* Ajuste para o Markdown não bugar o visual */
        .message-content p {
            margin-bottom: 8px;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #ff69b4 0%, #ff85c1 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: white;
            color: #d1486a;
            border: 2px solid #ffc0e0;
            border-bottom-left-radius: 5px;
        }

        .input-section {
            padding: 20px;
            border-top: 2px solid #ffb6d9;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: white;
            border-radius: 25px;
            border: 2px solid #ffc0e0;
            padding: 10px 20px;
        }

        #messageInput {
            width: 100%;
            border: none;
            outline: none;
        }

        .send-btn {
            background: #ff69b4;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- BOTÃO DE LIMPAR -->
        <button class="btn-limpar" onclick="limparConversa()">🗑️ Limpar</button>

        <div class="header">
            <div class="bow-decoration">🎀</div>
            <div class="header-title">IA Hello Kitty</div>
            <div class="header-subtitle">Sua assistente delicada 💕</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🎀</div>
                <div class="empty-state-text">Olá! Vamos conversar? 💕</div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Digite aqui..." autocomplete="off">
            </div>
            <button class="send-btn" id="sendBtn">↑</button>
        </div>
    </div>

    <script>
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContainer = document.getElementById('chatContainer');
    let isFirstMessage = true;

    // Função para adicionar mensagens na tela (com Markdown)
    function addMessage(content, isUser = false) {
        if (isFirstMessage) {
            chatContainer.innerHTML = '';
            isFirstMessage = false;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';

        if (isUser) {
            contentDiv.textContent = content;
        } else {
            // MÁGICA: Converte Markdown para HTML
            contentDiv.innerHTML = marked.parse(content);
        }

        messageDiv.appendChild(contentDiv);
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Função para Limpar o Banco (Reset de Memória)
    async function limparConversa() {
        if (confirm("Deseja apagar toda a nossa conversa? 🎀")) {
            try {
                const response = await fetch('https://ia-lzyc.onrender.com/api/chat/limpar', { 
                    method: 'DELETE' 
                });
                
                if (response.ok) {
                    chatContainer.innerHTML = '<div class="empty-state">Memória limpa! Vamos começar de novo? 💕</div>';
                    isFirstMessage = true;
                }
            } catch (error) {
                alert("Erro ao limpar a conversa.");
            }
        }
    }

    // Função para Enviar Mensagem
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        addMessage(message, true);
        messageInput.value = '';
        showLoading();

        try {
            const response = await fetch('https://ia-lzyc.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            removeLoading();
            const data = await response.json();

            if (response.ok) {
                // Exibe a resposta da IA (reply ou resposta)
                addMessage(data.reply || data.resposta, false);
            } else {
                addMessage('Ops! Ocorreu um erro. Tente novamente! 🎀', false);
            }
        } catch (error) {
            removeLoading();
            addMessage('Erro de conexão com o servidor. 🎀', false);
            console.error(error);
        }
    }

    function showLoading() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'loadingMessage';
        div.innerHTML = '<div class="message-content">Digitando... 🎀</div>';
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeLoading() {
        const load = document.getElementById('loadingMessage');
        if (load) load.remove();
    }

    // Eventos de clique e teclado
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>

</html>
